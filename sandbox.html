<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animación de Cargando</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
        }

        canvas {
            background: transparent;
        }
        
        .loading {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            color: white;
            font-family: Arial, sans-serif;
        }

        .gray {
        color: #888; /* gris medio */
        }
    </style>
</head>

<body>
    
    <!-- Copiar para primer mensaje -->
    <!-- Respuesta del programa en js -->
                        <div class="align-self-start">
                            <div class="d-flex justify-content-start">
                                <div class="d-flex flex-column align-items-start">
                                    <div class="d-flex justify-content-start gap-4">
                                        <span></span>
                                        <span><b>Bot</b></span>
                                    </div>
                                    <div class="d-flex justify-content-start gap-2">
                                        <i class="bi bi-person-circle text-light"></i>
                                        <!-- AQUI PONDREMOS EL MENSAJE -->
                                        <div class="loading"><canvas id="loader" width="50" height="50"></canvas><h2 id="loadingText"></h2></div>
                                    </div>
                                </div>
                            </div>
                        </div>
    

    <script>
        const canvas = document.getElementById("loader");
        const ctx = canvas.getContext("2d");

        let angle = 0;
        let hue = 0;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const x = canvas.width / 2;
            const y = canvas.height / 2;
            const radius = 15;
            const lineWidth = 3;

            // Fondo tenue del círculo
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = lineWidth;
            ctx.stroke();

            // Parte animada
            ctx.beginPath();
            ctx.arc(x, y, radius, angle, angle + Math.PI * 1.3);
            ctx.strokeStyle = `rgb(255,255,255)`;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = "round";
            ctx.stroke();

            // Actualiza ángulo y color
            angle += 0.1;
            hue = (hue + 2) % 360;

            requestAnimationFrame(draw);
        }

        const textElement = document.getElementById("loadingText");
        const word = "Cargando";
        const letters = word.split("");

        // Crear los spans por letra
        letters.forEach(letter => {
        const span = document.createElement("span");
        span.textContent = letter;
        textElement.appendChild(span);
        });

        const spans = textElement.querySelectorAll("span");
        let index = 0;

        function waveEffect() {
        // resetear colores
        spans.forEach(span => (span.classList.remove("gray")));
        // aplicar gris a la letra actual
        spans[index].classList.add("gray");

        // avanzar al siguiente índice
        index = (index + 1) % spans.length;
        }

        //iniciar el efecto
        setInterval(waveEffect, 150); // cada 150ms cambia la letra
        draw();
    </script>
</body>

</html>
